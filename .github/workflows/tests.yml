name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            tox-environment: py312-flask31
          - python-version: "3.13"
            tox-environment: py313-flask31
          - python-version: "3.14"
            tox-environment: py314-flask31

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run test matrix
        run: tox -e ${{ matrix.tox-environment }}

      - name: Final status
        if: success()
        run: echo "Tests passed for Python ${{ matrix.python-version }}"
